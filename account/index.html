<html lang="en">
<head>

  -webkit-overscroll-behavior: none !important;

  <style>body{opacity:0;transition:opacity .18s ease}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"/>
<style>
/* ── ACCOUNT PAGE THEME: Zinc + White CTA ── */
html, body { background-color: #0c0c0e !important; }
body {
  font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip !important;
}
.ma-head {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  background: rgba(12,12,14,0.9);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid #2a2a2f;
}
.ma-back {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: #18181b; border: 1px solid #2a2a2f; color: #f4f4f5; cursor: pointer;
  transition: border-color .15s;
}
.ma-back:hover { border-color: #3a3a42; }
.ma-title { font-size: 17px; font-weight: 700; color: #fff; }
.ma-wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 96px; }
.ma-card {
  background: #18181b; border: 1px solid #2a2a2f; border-radius: 16px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 12px 30px rgba(0,0,0,0.35);
  margin-bottom: 14px;
}
.ma-profile { display: flex; align-items: center; gap: 14px; padding: 18px; }
.ma-avatar {
  width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: #111113; border: 1px solid #2a2a2f;
  font-size: 18px; font-weight: 600; color: #fff; text-transform: uppercase;
}
.ma-name { font-size: 16px; font-weight: 600; color: #fff; line-height: 1.3; }
.ma-email { font-size: 13px; color: #a1a1aa; margin-top: 2px; word-break: break-all; }
.ma-section { padding: 18px; }
.ma-h { font-size: 15px; font-weight: 600; color: #fff; }
.ma-sub { font-size: 13px; color: #a1a1aa; margin: 3px 0 16px; }
.ma-label { display: block; font-size: 12.5px; font-weight: 500; color: #a1a1aa; margin-bottom: 6px; }
.ma-input {
  width: 100%; height: 44px; padding: 0 14px; margin-bottom: 14px; box-sizing: border-box;
  background: #111113; border: 1px solid #2a2a2f; border-radius: 10px;
  color: #fff; font-size: 14px; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.ma-input:hover { border-color: #3a3a42; }
.ma-input:focus { border-color: #1f6fff; box-shadow: 0 0 0 3px rgba(31,111,255,0.25); }
.ma-btn {
  width: 100%; height: 44px; border-radius: 10px; border: none; cursor: pointer;
  background: #fff; color: #0a0a0a; font-size: 14px; font-weight: 600;
  transition: background .15s, transform .15s;
}
.ma-btn:hover { background: #e9e9ec; }
.ma-btn:active { transform: scale(0.98); }
.ma-logout {
  width: 100%; height: 44px; border-radius: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: transparent; border: 1px solid #2a2a2f; color: #f87171;
  font-size: 14px; font-weight: 500;
  transition: background .15s, border-color .15s;
}
.ma-logout:hover { background: rgba(239,68,68,0.06); border-color: rgba(239,68,68,0.35); }
#maPassMsg { font-size: 13px; margin: -4px 0 12px; }
</style>
</head>
<body class="text-white min-h-screen">

<!-- TOP HEADER -->
<div class="ma-head">
  <button onclick="window.location.href='/dashboard'" class="ma-back" aria-label="Back">
    <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>
  </button>
  <p class="ma-title">My Account</p>
</div>

<!-- CONTENT -->
<div class="ma-wrap">

  <!-- Profile -->
  <div class="ma-card">
    <div class="ma-profile">
      <div id="maAvatar" class="ma-avatar">U</div>
      <div class="min-w-0">
        <p id="maUsername" class="ma-name">-</p>
        <p id="maEmailDetail" class="ma-email">-</p>
      </div>
    </div>
  </div>

  <!-- Change Password -->
  <div class="ma-card">
    <div class="ma-section">
      <p class="ma-h">Change password</p>
      <p class="ma-sub">You'll be logged out after updating it.</p>
      <label class="ma-label" for="maCurrPass">Current password</label>
      <input id="maCurrPass" type="password" class="ma-input" autocomplete="current-password"/>
      <label class="ma-label" for="maNewPass">New password</label>
      <input id="maNewPass" type="password" class="ma-input" autocomplete="new-password" placeholder="At least 6 characters"/>
      <label class="ma-label" for="maConfPass">Confirm new password</label>
      <input id="maConfPass" type="password" class="ma-input" autocomplete="new-password"/>
      <p id="maPassMsg" class="hidden"></p>
      <button onclick="changePassword()" class="ma-btn">Update password</button>
    </div>
  </div>

  <!-- Logout -->
  <button onclick="logout()" class="ma-logout">
    <span class="material-symbols-outlined" style="font-size:18px">logout</span>
    Logout
  </button>

</div>

<script>
// Load user data
const name  = localStorage.getItem('getxh_user_name') || '';
const email = localStorage.getItem('getxh_current_user') || '';
const n = name || email.split('@')[0] || '-';

document.getElementById('maUsername').textContent = n;
document.getElementById('maEmailDetail').textContent = email || '-';
document.getElementById('maAvatar').textContent = (n && n !== '-') ? n.charAt(0) : 'U';

function logout() {
  if (typeof window._logoutUser === 'function') {
    window._logoutUser();
    return;
  }
  sessionStorage.setItem("getxh_logged_out", "yes");
  localStorage.clear();
  window.location.href = '/';
}

function changePassword() {
  const curr = document.getElementById('maCurrPass').value.trim();
  const nw   = document.getElementById('maNewPass').value.trim();
  const conf = document.getElementById('maConfPass').value.trim();
  const msg  = document.getElementById('maPassMsg');

  function showMsg(text, isError) {
    msg.textContent = text;
    msg.style.color = isError ? '#f87171' : '#4ade80';
    msg.classList.remove('hidden');
  }

  if(!curr||!nw||!conf) return showMsg('Please fill in all fields.', true);
  if(nw.length < 6)     return showMsg('New password must be at least 6 characters.', true);
  if(nw !== conf)       return showMsg('New passwords do not match.', true);

  if(typeof window._doChangePassword==='function') {
    showMsg('Updating…', false);
    window._doChangePassword(curr, nw, function(err) {
      if(err) showMsg('Current password is incorrect.', true);
      else { showMsg('Password updated. Logging you out…', false); setTimeout(()=>logout(), 2000); }
    });
  }
}
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyClO8clBVgSHKx8jarNwC38oMtWRK0W8KE",
  authDomain: "getxh.in",
  projectId: "getxh-42588",
  storageBucket: "getxh-42588.firebasestorage.app",
  messagingSenderId: "170770122888",
  appId: "1:170770122888:web:7adcf91077d5695b06b73d"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

window._logoutUser = async function() {
  try {
    await signOut(auth);
  } catch (err) {
    console.error("Logout error:", err);
  } finally {
    sessionStorage.setItem("getxh_logged_out", "yes");
    localStorage.clear();
    window.location.href = '/';
  }
};

onAuthStateChanged(auth, (user) => {
  if(!user) {
    window.location.href = '/';
    return;
  }

  window._doChangePassword = async function(currPass, newPass, callback) {
    try {
      const cred = EmailAuthProvider.credential(user.email, currPass);
      await reauthenticateWithCredential(user, cred);
      await updatePassword(user, newPass);
      callback(null);
    } catch(err) {
      callback(err);
    }
  };
});
</script>

<script>requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.style.opacity=1))</script>
</body>
</html>
