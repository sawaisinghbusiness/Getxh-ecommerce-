<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Secret Links Admin — GETXH</title>
<meta name="robots" content="noindex, nofollow"/>
<meta name="referrer" content="no-referrer"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020617;--surface:#0f172a;--surface2:#1e293b;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.06);
  --text:#f1f5f9;--muted:#94a3b8;--sub:#64748b;
  --purple:#8b5cf6;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;
  --grad:linear-gradient(135deg,#8b5cf6,#3b82f6);
}
html,body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hidden{display:none!important}
/* auth */
#authScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:36px 30px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.auth-logo{font-size:1.2rem;font-weight:800;color:var(--purple);margin-bottom:4px}
.auth-sub{font-size:.85rem;color:var(--muted);margin-bottom:24px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:10px;font:inherit;font-size:.92rem;outline:none;margin-bottom:14px}
input:focus,textarea:focus{border-color:var(--purple)}
textarea{min-height:96px;resize:vertical}
.btn{padding:11px 18px;border-radius:10px;border:none;background:var(--grad);color:#fff;font:700 .9rem 'Inter',sans-serif;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.88}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.full{width:100%}
.btn.ghost{background:var(--surface2);border:1px solid var(--border)}
.btn.danger{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.35);color:#fca5a5}
.btn.small{padding:7px 12px;font-size:.8rem}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5;padding:10px 14px;border-radius:8px;font-size:.85rem;margin-bottom:14px}
/* app */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border2);background:var(--surface)}
.topbar a{color:var(--muted);font-size:.85rem;text-decoration:none;margin-right:14px}
.topbar strong{font-weight:800}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:22px}
.panel h2{font-size:1.02rem;font-weight:800;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.hint{font-size:.78rem;color:var(--sub);margin:-8px 0 14px}
.linkbox{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);border-radius:12px;padding:16px;margin-bottom:18px}
.linkbox b{color:#86efac}
.linkbox code{display:block;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin:10px 0;font-size:.78rem;word-break:break-all;user-select:all}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:620px}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:11px 10px;border-bottom:1px solid var(--border2);vertical-align:top;word-break:break-word}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge.active{background:rgba(34,197,94,.15);color:#86efac}
.badge.revoked{background:rgba(239,68,68,.15);color:#fca5a5}
.badge.expired{background:rgba(245,158,11,.15);color:#fcd34d}
.badge.exhausted{background:rgba(148,163,184,.15);color:#cbd5e1}
.bar{height:6px;border-radius:99px;background:var(--surface2);margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad)}
.claims{background:var(--bg);border-radius:10px;padding:10px 14px;margin-top:8px;font-size:.82rem;color:var(--muted)}
.claims div{padding:3px 0;display:flex;justify-content:space-between;gap:10px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);padding:11px 18px;border-radius:10px;font-size:.88rem;z-index:20}
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">⚡ Secret Links</div>
    <div class="auth-sub">Admin sign in</div>
    <div class="err hidden" id="authErr"></div>
    <label for="authEmail">Email</label>
    <input type="email" id="authEmail" placeholder="agency@getxh.in" autocomplete="email"/>
    <label for="authPass">Password</label>
    <input type="password" id="authPass" autocomplete="current-password"/>
    <button class="btn full" id="authBtn">Sign In</button>
  </div>
</div>

<div id="appScreen" class="hidden">
  <div class="topbar">
    <div><strong>Secret Links</strong> <span style="color:var(--sub);font-size:.8rem" id="topEmail"></span></div>
    <div><a href="/admin">← Admin panel</a><button class="btn ghost small" id="logoutBtn">Sign out</button></div>
  </div>

  <div class="wrap">
    <div class="panel">
      <h2>Create a link</h2>
      <div class="err hidden" id="createErr"></div>
      <div id="newLink" class="linkbox hidden">
        <b>Link created. Copy it now: it is shown only once and cannot be recovered.</b>
        <code id="newLinkUrl"></code>
        <button class="btn small" id="copyBtn">Copy link</button>
      </div>
      <div class="grid">
        <div><label for="fName">Service name</label><input id="fName" maxlength="80" placeholder="e.g. Free Reels Tool"/></div>
        <div><label for="fViews">How many views?</label><input id="fViews" type="number" min="1" max="1000000" value="50000"/></div>
      </div>
      <p class="hint">One view = one user claiming the link once. When the views are used up, the link closes by itself.</p>
      <label for="fTitle">Title (what the user sees)</label>
      <input id="fTitle" maxlength="120" placeholder="e.g. Your free access is ready"/>
      <label for="fText">Text</label>
      <textarea id="fText" maxlength="2000" placeholder="Shown as plain text."></textarea>
      <div class="grid">
        <div><label for="fBtnLabel">Button label (optional)</label><input id="fBtnLabel" maxlength="40" placeholder="Open"/></div>
        <div><label for="fBtnUrl">Button link (optional, https only)</label><input id="fBtnUrl" type="url" placeholder="https://…"/></div>
      </div>
      <label for="fExpiry">Expiry (optional)</label>
      <input id="fExpiry" type="datetime-local"/>
      <button class="btn" id="createBtn">Create link</button>
    </div>

    <div class="panel">
      <h2>Links</h2>
      <div class="err hidden" id="listErr"></div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Service</th><th>Views</th><th>Status</th><th>Expires</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="hint" id="emptyMsg" style="margin-top:14px">No links yet.</p>
    </div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const API = "https://backend-for-api-connect-g8ta.onrender.com/secret-links";
const ADMIN_EMAIL = "agency@getxh.in";
const app = initializeApp({
  apiKey: "AIzaSyClO8clBVgSHKx8jarNwC38oMtWRK0W8KE",
  authDomain: "getxh-42588.firebaseapp.com",
  projectId: "getxh-42588",
  storageBucket: "getxh-42588.firebasestorage.app",
  messagingSenderId: "170770122888",
  appId: "1:170770122888:web:7adcf91077d5695b06b73d"
});
const auth = getAuth(app);
const $ = (id) => document.getElementById(id);
let me = null;

function showErr(id, msg) { const e = $(id); e.textContent = msg; e.classList.toggle("hidden", !msg); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.remove("hidden"); setTimeout(() => t.classList.add("hidden"), 2600); }
const fmt = (ms) => ms ? new Date(ms).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) : "—";

async function api(method, path, body) {
  const idToken = await me.getIdToken();
  const res = await fetch(API + path, {
    method, cache: "no-store", referrerPolicy: "no-referrer", credentials: "omit",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + idToken },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || "Request failed (" + res.status + ")");
  return data;
}

// ── sign in (admin only) ──
onAuthStateChanged(auth, (user) => {
  if (user && String(user.email || "").toLowerCase() === ADMIN_EMAIL) {
    me = user;
    $("authScreen").classList.add("hidden");
    $("appScreen").classList.remove("hidden");
    $("topEmail").textContent = user.email;
    loadLinks();
  } else if (user) {
    signOut(auth);
    showErr("authErr", "Access denied. Admin only.");
  } else {
    me = null;
    $("authScreen").classList.remove("hidden");
    $("appScreen").classList.add("hidden");
  }
});
async function doLogin() {
  const email = $("authEmail").value.trim(), pass = $("authPass").value;
  if (!email || !pass) return;
  const btn = $("authBtn"); btn.disabled = true; btn.textContent = "Signing in…"; showErr("authErr", "");
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch (_) { showErr("authErr", "Invalid email or password."); }
  btn.disabled = false; btn.textContent = "Sign In";
}
$("authBtn").onclick = doLogin;
$("authPass").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
$("logoutBtn").onclick = () => signOut(auth);

// ── create ──
$("createBtn").onclick = async () => {
  showErr("createErr", ""); $("newLink").classList.add("hidden");
  const expiryVal = $("fExpiry").value;
  const body = {
    name: $("fName").value, title: $("fTitle").value, text: $("fText").value,
    buttonLabel: $("fBtnLabel").value, buttonUrl: $("fBtnUrl").value.trim(),
    views: $("fViews").value.trim(),
    expiresAt: expiryVal ? new Date(expiryVal).getTime() : ""
  };
  const btn = $("createBtn"); btn.disabled = true; btn.textContent = "Creating…";
  try {
    const r = await api("POST", "/admin/create", body);
    $("newLinkUrl").textContent = r.url;
    $("newLink").classList.remove("hidden");
    ["fName", "fTitle", "fText", "fBtnLabel", "fBtnUrl", "fExpiry"].forEach((i) => ($(i).value = ""));
    loadLinks();
  } catch (e) { showErr("createErr", e.message); }
  btn.disabled = false; btn.textContent = "Create link";
};
$("copyBtn").onclick = async () => {
  const url = $("newLinkUrl").textContent;
  try { await navigator.clipboard.writeText(url); toast("Link copied"); }
  catch (_) { const r = document.createRange(); r.selectNodeContents($("newLinkUrl")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Press copy on your keyboard"); }
};

// ── list / claims / revoke (every value is put in with textContent, never as HTML) ──
function td(...kids) { const c = document.createElement("td"); for (const k of kids) c.append(k); return c; }
function btn(text, cls, onclick) { const b = document.createElement("button"); b.className = "btn small " + cls; b.textContent = text; b.onclick = onclick; return b; }

async function loadLinks() {
  showErr("listErr", "");
  try {
    const { links } = await api("GET", "/admin/links");
    const rows = $("rows"); rows.replaceChildren();
    $("emptyMsg").classList.toggle("hidden", links.length > 0);
    for (const l of links) rows.append(...buildRow(l));
  } catch (e) { showErr("listErr", e.message); }
}

function buildRow(l) {
  const tr = document.createElement("tr");
  const title = document.createElement("div"); title.style.fontWeight = "700"; title.textContent = l.name;
  const sub = document.createElement("div"); sub.style.cssText = "color:var(--sub);font-size:.78rem"; sub.textContent = l.title + " · created " + fmt(l.createdAt);
  const views = document.createElement("div"); views.textContent = l.used.toLocaleString() + " / " + l.totalViews.toLocaleString();
  const bar = document.createElement("div"); bar.className = "bar"; const fill = document.createElement("i");
  fill.style.width = Math.min(100, (l.used / l.totalViews) * 100) + "%"; bar.append(fill); views.append(bar);
  const badge = document.createElement("span"); badge.className = "badge " + l.status; badge.textContent = l.status;
  const actions = document.createElement("div"); actions.className = "row-actions";

  const detail = document.createElement("tr"); detail.className = "hidden";
  const dcell = document.createElement("td"); dcell.colSpan = 5; detail.append(dcell);

  actions.append(btn("Claimed by", "ghost", async () => {
    if (!detail.classList.toggle("hidden")) {
      dcell.replaceChildren(Object.assign(document.createElement("div"), { className: "claims", textContent: "Loading…" }));
      try {
        const { claims } = await api("GET", "/admin/links/" + l.id + "/claims?limit=100");
        const box = document.createElement("div"); box.className = "claims";
        if (!claims.length) box.textContent = "Nobody has claimed this link yet.";
        for (const c of claims) {
          const line = document.createElement("div");
          const who = document.createElement("span"); who.textContent = c.name + (c.email ? " (" + c.email + ")" : "");
          const when = document.createElement("span"); when.textContent = fmt(c.claimedAt);
          line.append(who, when); box.append(line);
        }
        dcell.replaceChildren(box);
      } catch (e) { dcell.replaceChildren(Object.assign(document.createElement("div"), { className: "claims", textContent: e.message })); }
    }
  }));
  if (l.status === "active") {
    actions.append(btn("Revoke", "danger", async (ev) => {
      if (!confirm("Revoke this link? It stops working immediately.")) return;
      ev.currentTarget.disabled = true;
      try { await api("POST", "/admin/links/" + l.id + "/revoke"); toast("Link revoked"); loadLinks(); }
      catch (e) { toast(e.message); ev.currentTarget.disabled = false; }
    }));
  }
  tr.append(td(title, sub), td(views), td(badge), td(document.createTextNode(fmt(l.expiresAt))), td(actions));
  return [tr, detail];
}
</script>
</body>
</html>
