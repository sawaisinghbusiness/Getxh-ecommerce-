<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verify OTP | GETXH – SMM Panel India</title>
<meta name="description" content="Verify your OTP to reset password."/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/GETXH WEB NEW LOGO.png" type="image/png"/>

<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#020617;--bg2:#0f172a;--purple:#8b5cf6;--blue:#3b82f6;
  --text:#f1f5f9;--muted:#94a3b8;
}

html,body{
  height:100%;font-family:'Inter',sans-serif;
  background:#000510;color:var(--text);overflow-x:hidden;
}
a,button,input,.card,.orb{transition:all 0.3s ease;}

/* Background */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 110% 22% at 28% 70%,rgba(140,225,255,0.38) 0%,rgba(30,130,255,0.18) 22%,rgba(0,60,200,0.05) 48%,transparent 62%),
    radial-gradient(ellipse 95% 85% at -15% 115%,rgba(0,80,220,0.28) 0%,rgba(0,45,170,0.1) 38%,transparent 62%),
    radial-gradient(ellipse 75% 65% at 3% 3%,rgba(0,55,170,0.18) 0%,transparent 58%),
    radial-gradient(ellipse 50% 40% at 85% 15%,rgba(0,30,100,0.12) 0%,transparent 55%),
    linear-gradient(170deg,#000d28 0%,#000614 35%,#000208 100%);
}

.page{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px 20px;position:relative;z-index:2;
}

.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:0.6;z-index:0;}
.orb-1{width:500px;height:500px;background:rgba(139,92,246,0.22);top:-140px;left:-120px;}
.orb-2{width:400px;height:400px;background:rgba(59,130,246,0.16);bottom:-80px;right:-60px;}

.wrap{width:100%;max-width:440px;position:relative;z-index:2;}

/* Logo */
.brand{display:flex;justify-content:center;align-items:center;margin-bottom:24px;}
.brand-logo-wrap{display:inline-flex;mix-blend-mode:screen;}
.brand-logo-wrap img{height:90px;width:auto;display:block;filter:invert(1) hue-rotate(180deg) brightness(1.1);}

/* Card */
.card-shine-wrap{position:relative;width:100%;border-radius:24px;padding:1.5px;}
.card-shine-wrap::before{content:'';position:absolute;inset:0;border-radius:24px;background:conic-gradient(from var(--shine-angle,0deg),transparent 0deg,rgba(139,92,246,0.9) 60deg,rgba(59,130,246,0.8) 120deg,rgba(6,182,212,0.7) 180deg,transparent 240deg);animation:card-spin 5s linear infinite;z-index:0;}
.card-shine-wrap::after{content:'';position:absolute;inset:1.5px;border-radius:22.5px;background:#080f1e;z-index:1;}
@keyframes card-spin{to{--shine-angle:360deg;}}
@property --shine-angle{syntax:'<angle>';initial-value:0deg;inherits:false;}

.card{position:relative;z-index:2;width:100%;background:rgba(10,16,34,0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:36px 32px;box-shadow:0 32px 80px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.08);}

.card-head{text-align:center;margin-bottom:24px;}
.card-title{font-size:22px;font-weight:800;letter-spacing:-0.02em;color:#ffffff;}
.card-sub{font-size:13px;color:#94a3b8;margin-top:6px;line-height:1.5;}
.email-badge{display:inline-block;color:#a78bfa;font-weight:700;word-break:break-all;}

/* Boxes */
#errorBox{display:none;align-items:center;gap:8px;padding:11px 14px;border-radius:10px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.22);color:#fca5a5;font-size:12.5px;font-weight:500;margin-bottom:16px;}
#infoBox{display:none;align-items:center;gap:8px;padding:11px 14px;border-radius:10px;background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.22);color:#86efac;font-size:12.5px;font-weight:500;margin-bottom:16px;}

/* Form */
.fgroup{margin-bottom:16px;}
.flabel{display:block;font-size:10.5px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;}
.iwrap{position:relative;}
.iicon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#64748b;pointer-events:none;display:flex;transition:color 0.25s;}
.iwrap:focus-within .iicon{color:#8b5cf6;}
.finput-otp{width:100%;height:48px;background:rgba(139,92,246,0.07);border:1px solid rgba(139,92,246,0.3);border-radius:12px;padding:0 14px 0 40px;color:#e2e8f0;font-size:18px;font-family:'Inter',sans-serif;letter-spacing:0.25em;font-weight:700;outline:none;transition:all 0.28s ease;}
.finput-otp::placeholder{color:#475569;letter-spacing:0.04em;font-size:13px;font-weight:400;}
.finput-otp:focus{border-color:rgba(139,92,246,0.7);box-shadow:0 0 0 3px rgba(139,92,246,0.16),0 0 20px rgba(139,92,246,0.22);background:rgba(139,92,246,0.1);}

/* Validation */
.field-err{font-size:11.5px;font-weight:500;color:#f87171;margin-top:5px;padding-left:3px;min-height:15px;display:flex;align-items:center;gap:5px;opacity:0;transform:translateY(-5px);transition:opacity 0.22s ease,transform 0.22s ease;pointer-events:none;}
.field-err.show{opacity:1;transform:translateY(0);}
.finput-otp.input-error{border-color:rgba(239,68,68,0.65)!important;box-shadow:0 0 0 3px rgba(239,68,68,0.13),0 0 18px rgba(239,68,68,0.09)!important;}

@keyframes shake{0%,100%{transform:translateX(0);}15%{transform:translateX(-3.5px);}30%{transform:translateX(3.5px);}48%{transform:translateX(-2.5px);}64%{transform:translateX(2.5px);}80%{transform:translateX(-1px);}92%{transform:translateX(1px);}}
.shake{animation:shake 0.36s cubic-bezier(0.36,0.07,0.19,0.97) both;}

.btn{width:100%;height:44px;border:none;border-radius:12px;background:linear-gradient(135deg,#8b5cf6 0%,#3b82f6 100%);color:#fff;font-size:14px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;position:relative;overflow:hidden;transition:all 0.3s ease;box-shadow:0 8px 28px rgba(139,92,246,0.35);margin-top:8px;}
.btn:hover:not(:disabled){transform:translateY(-2px) scale(1.02);box-shadow:0 16px 40px rgba(139,92,246,0.55);}
.btn:disabled{opacity:0.65;cursor:not-allowed;}

.resend-wrap{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:12.5px;color:#64748b;}
.btn-resend{background:none;border:none;color:#8b5cf6;font-size:12.5px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;padding:0;transition:color 0.2s;}
.btn-resend:hover:not(:disabled){color:#a78bfa;}
.btn-resend:disabled{color:#475569;cursor:not-allowed;}

.cfoot{display:flex;align-items:center;justify-content:center;margin-top:20px;gap:6px;font-size:13px;color:#475569;}
.link-back{font-size:13px;font-weight:600;color:#8b5cf6;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:color 0.2s;}
.link-back:hover{color:#a78bfa;}
</style>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>{r.forEach(reg=>reg.unregister())})}</script>
</head>

<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="page">
  <div class="wrap">

    <div class="brand">
      <div class="brand-logo-wrap">
        <img src="/GETXH WEB NEW LOGO.png" alt="GETXH"/>
      </div>
    </div>

    <div class="card-shine-wrap">
      <div class="card">

        <div class="card-head">
          <h1 class="card-title">Verify OTP</h1>
          <p class="card-sub">Enter the verification code sent to <br/><span id="emailHint" class="email-badge"></span></p>
        </div>

        <div id="errorBox"></div>
        <div id="infoBox"></div>

        <div class="fgroup">
          <label class="flabel" for="otp">OTP Code</label>
          <div class="iwrap">
            <span class="iicon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" spellcheck="false"
              class="finput-otp" placeholder="1 2 3 4 5 6"
              oninput="clearErr('otp','err-otp')"
              onkeydown="if(event.key==='Enter')verifyOTP()"/>
          </div>
          <div class="field-err" id="err-otp"></div>
        </div>

        <button id="verifyBtn" class="btn" onclick="verifyOTP()">Verify OTP</button>

        <div class="resend-wrap">
          <span>Didn't receive the code?</span>
          <button id="resendBtn" class="btn-resend" onclick="resendOTP()" disabled>Resend OTP in <span id="timerVal">60</span>s</button>
        </div>

        <div class="cfoot">
          <a class="link-back" href="/forgot-password">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
            </svg>
            Change Email Address
          </a>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const email  = String(params.get("email") || "").trim().toLowerCase();
const type   = params.get("type") || "reset";

if (!email) {
  window.location.href = "/forgot-password";
} else {
  document.getElementById("emailHint").textContent = email;
}

let timerInterval = null;
let timerSeconds = 60;

function startTimer() {
  clearInterval(timerInterval);
  timerSeconds = 60;
  const btn = document.getElementById("resendBtn");
  const val = document.getElementById("timerVal");
  btn.disabled = true;

  timerInterval = setInterval(() => {
    timerSeconds--;
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      btn.disabled = false;
      btn.textContent = "Resend OTP";
    } else {
      btn.innerHTML = `Resend OTP in <span id="timerVal">${timerSeconds}</span>s`;
    }
  }, 1000);
}

startTimer();

function setErr(inputId, errId, msg) {
  const inp = document.getElementById(inputId);
  const err = document.getElementById(errId);
  if (inp) inp.classList.add("input-error");
  if (err) { err.textContent = msg; err.classList.add("show"); }
}

function clearErr(inputId, errId) {
  const inp = document.getElementById(inputId);
  const err = document.getElementById(errId);
  if (inp) inp.classList.remove("input-error");
  if (err) { err.textContent = ""; err.classList.remove("show"); }
  const eb = document.getElementById("errorBox");
  if (eb) eb.style.display = "none";
}

function shake(inputId) {
  const el = document.getElementById(inputId);
  if (!el) return;
  const wrap = el.closest(".iwrap") || el;
  wrap.classList.remove("shake");
  void wrap.offsetWidth;
  wrap.classList.add("shake");
  if (navigator.vibrate) { try { navigator.vibrate(30); } catch(e){} }
  wrap.addEventListener("animationend", () => wrap.classList.remove("shake"), { once: true });
}

function showError(msg) {
  const eb = document.getElementById("errorBox");
  eb.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> ' + msg;
  eb.style.display = "flex";
}

function showInfo(msg) {
  const ib = document.getElementById("infoBox");
  ib.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg> ' + msg;
  ib.style.display = "flex";
}

async function verifyOTP() {
  const otpInp = document.getElementById("otp");
  const otp = String(otpInp.value || "").trim();
  const btn = document.getElementById("verifyBtn");

  clearErr("otp", "err-otp");

  if (!otp) {
    setErr("otp", "err-otp", "Enter the OTP code from your email");
    shake("otp");
    otpInp.focus();
    return;
  }

  if (otp.length < 4) {
    setErr("otp", "err-otp", "Enter full OTP code");
    shake("otp");
    otpInp.focus();
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;animation:spin 0.7s linear infinite;display:inline-block"></span>Verifying…</span>';

  try {
    const res = await fetch("https://getxh.online/verify-otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, otp: otp, type: type })
    });

    const data = await res.json().catch(() => ({}));

    if (res.ok && (data.success || data.status === "success" || data.valid || data.message === "OTP verified")) {
      showInfo("OTP verified successfully! Redirecting…");
      try {
        sessionStorage.setItem("gx_reset_email", email);
        sessionStorage.setItem("gx_reset_otp", otp);
      } catch(e){}
      setTimeout(() => {
        window.location.href = `/reset-password?email=${encodeURIComponent(email)}&otp=${encodeURIComponent(otp)}`;
      }, 600);
    } else {
      const msg = data.error || data.message || "Incorrect OTP. Please check and try again.";
      setErr("otp", "err-otp", msg);
      shake("otp");
      btn.disabled = false;
      btn.textContent = "Verify OTP";
    }
  } catch (err) {
    showError("Cannot reach server. Please check your internet connection.");
    shake("otp");
    btn.disabled = false;
    btn.textContent = "Verify OTP";
  }
}

async function resendOTP() {
  const btn = document.getElementById("resendBtn");
  btn.disabled = true;
  btn.textContent = "Sending…";

  try {
    const res = await fetch("https://getxh.online/send-otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, type: type })
    });

    const data = await res.json().catch(() => ({}));

    if (res.ok && (data.success || data.status === "success" || data.message === "OTP sent")) {
      showInfo("New OTP sent to your email address!");
      startTimer();
    } else {
      showError(data.message || data.error || "Failed to resend OTP. Please try again.");
      btn.disabled = false;
      btn.textContent = "Resend OTP";
    }
  } catch (err) {
    showError("Cannot reach server. Check your connection.");
    btn.disabled = false;
    btn.textContent = "Resend OTP";
  }
}
</script>
<style>@keyframes spin{to{transform:rotate(360deg);}}</style>
</body>
</html>
