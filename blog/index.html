*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --font:'Plus Jakarta Sans','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
  --bg-start:#f7f8fd;
  --bg-end:#eef2ff;
  --purple:#7c3aed;
  --blue:#2563eb;
  --grad:linear-gradient(135deg,#7c3aed 0%,#2563eb 100%);
  --heading:#0f172a;
  --body:#3f4a5c;
  --muted:#64748b;
  --border:#e6e9f2;
  --card-bg:#ffffff;
  --shadow:0 10px 30px rgba(15,23,42,0.06);
}

html,body{
  font-family:var(--font);
  background:linear-gradient(180deg,var(--bg-start) 0%,var(--bg-end) 100%);
  color:var(--body);
  overflow-x:hidden;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:

    radial-gradient(circle at 10% 50%, rgba(37,99,235,0.09) 0%, transparent 45%);
}

/* ── NAVBAR ── */
.navbar{

  border-image:linear-gradient(90deg,#7c3aed,#2563eb) 1;
  box-shadow:0 4px 20px rgba(15,23,42,0.03);
}
.nav-logo{display:flex;align-items:center;}
.nav-logo img{height:44px;width:auto;object-fit:contain;}
.nav-links{display:flex;align-items:center;gap:8px;}
.nav-link{
  font-size:14px;font-weight:600;color:var(--muted);
  text-decoration:none;padding:7px 16px;border-radius:99px;
  transition:all 0.2s ease;
}
.nav-link:hover{color:var(--heading);background:rgba(124,58,237,0.06);}
.nav-link.active{
  color:#ffffff;
  background:var(--grad);
  box-shadow:0 4px 14px rgba(124,58,237,0.25);
}
.nav-btn{
  font-size:13.5px;font-weight:700;color:#fff;
  text-decoration:none;padding:8px 20px;border-radius:99px;
  background:var(--grad);
  box-shadow:0 4px 16px rgba(124,58,237,0.3);
  transition:all 0.25s ease;margin-left:6px;
}
.nav-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(124,58,237,0.45);}
.nav-btn-demo{

}
.nav-btn-demo:hover{background:rgba(124,58,237,0.06);border-color:var(--purple);box-shadow:none;}
.nav-ham{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;background:none;border:none;}
.nav-ham span{width:22px;height:2.5px;background:var(--heading);border-radius:2px;display:block;transition:all 0.3s;}
.nav-drawer{
  display:none;position:fixed;top:68px;left:0;right:0;z-index:99;
  background:rgba(255,255,255,0.96);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);

  box-shadow:0 20px 40px rgba(15,23,42,0.1);

}
.nav-drawer.open{display:flex;}
@keyframes drawerDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.nav-drawer .nav-link{padding:12px 18px;font-size:15px;border-radius:12px;text-align:left;}

/* ── SKELETON ── */

/* ── TITLE & EXCERPT ── */

}

.sk-title-s{height:44px;width:60%;margin-bottom:24px;}

.post-excerpt{

.post-body ul,.post-body ol{

.post-body details{

.post-body summary::-webkit-details-marker{display:none;}

function formatDate(ts) {
  if (!ts) return '';
  try {
    if (ts.toDate && typeof ts.toDate === 'function') {
      return ts.toDate().toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
    }
    if (ts.seconds) {
      return new Date(ts.seconds * 1000).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
    }
    const d = new Date(ts);
    if (!isNaN(d.getTime())) {
      return d.toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
    }
  } catch(e) {}
  return '';
}

function estimateReadTime(text) {
  const plain = String(text || '').replace(/<[^>]*>/g, '');
  const words = plain.split(/\s+/).length;
  const mins  = Math.max(1, Math.round(words / 200));
  return `${mins} min read`;
}

function escHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/**
 * TASK 1 CRITICAL BUG FIX:
 * Render the stored HTML body content as real HTML instead of escaping it with escHtml().
 * Authors type HTML into the admin "Body Content" field, so stored content IS markup.
 */
function renderBody(content) {
  if (!content) return '';
  let html = String(content).trim();

  // If content does not contain HTML tags, format standard markdown syntax to HTML without escaping tags
  if (!/<[a-z][\s\S]*>/i.test(html)) {
    html = html.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    html = html
      .replace(/^###\s+(.+)$/gm, '<h3>$1</h3>')
      .replace(/^##\s+(.+)$/gm, '<h2>$1</h2>')
      .replace(/^#\s+(.+)$/gm, '<h2>$1</h2>')
      .replace(/^---+\s*$/gm, '<hr>')
      .replace(/^\>\s?(.*)$/gm, '<blockquote>$1</blockquote>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code>$1</code>');

    const blocks = html.split(/\n{2,}/);
    html = blocks.map(b => {
      b = b.trim();
      if (!b) return '';
      if (/^<h[1-6]|^<blockquote|^<hr|^<ul|^<ol|^<table|^<details|^<div/.test(b)) return b;
      return `<p>${b.replace(/\n/g, '<br>')}</p>`;
    }).join('\n');
  }

  return html;
}

function showNotFound() {
  document.getElementById('articleContent').innerHTML = `
    <div class="not-found">
      <svg width="64" height="64" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"
          d="M9 12h6m-3-3v6M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <h2>Post not found</h2>
      <p>This blog post doesn't exist or has been removed.</p>
      <a href="/blogs">← Back to All Posts</a>
    </div>`;
}

async function loadPost() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) { window.location.replace('/blogs'); return; }

  try {
    const snap = await getDoc(doc(db, 'blogs', id));
    if (!snap.exists() || snap.data().published === false) { showNotFound(); return; }

    const post = { id: snap.id, ...snap.data() };

    // Update page title and meta
    document.title = `${post.title || 'Article'} | GETXH Blog`;
    if (post.excerpt) {
      let desc = document.querySelector('meta[name="description"]');
      if (!desc) {
        desc = document.createElement('meta');
        desc.name = 'description';
        document.head.appendChild(desc);
      }
      desc.content = post.excerpt;
    }

    const imgHtml = post.coverImage
      ? `<div class="cover-wrap"><img class="cover-img" src="${escHtml(post.coverImage)}" alt="${escHtml(post.title)}" onerror="this.parentElement.innerHTML='<div class=cover-placeholder>📝</div>'"></div>`
      : '';

    const readTime = estimateReadTime(post.body);

    document.getElementById('articleContent').innerHTML = `
      ${imgHtml}
      <div class="post-meta">
        ${post.category ? `<span class="post-category">${escHtml(post.category)}</span><span class="meta-dot"></span>` : ''}
        <span class="post-date">${formatDate(post.publishedAt || post.createdAt)}</span>
        <span class="meta-dot"></span>
        <span class="post-reading-time">${readTime}</span>
      </div>
      <h1 class="post-title">${escHtml(post.title || 'Untitled')}</h1>
      ${post.excerpt ? `<div class="post-excerpt">${escHtml(post.excerpt)}</div>` : ''}
      <div class="post-body">${renderBody(post.body || '')}</div>
      <div class="blog-cta-card">
        <h3>Ready to Boost Your Social Media Presence?</h3>
        <p>Join thousands of influencers, agencies, and brands using GETXH™ for instant, high-quality growth.</p>
        <a href="/register">Get Started Now — Register →</a>
      </div>
    `;
  } catch (err) {
    console.error('[blog]', err);
    showNotFound();
  }
}

loadPost();

// Navbar Drawer
window.toggleNavDrawer = function() {
  document.getElementById('navDrawer').classList.toggle('open');
};
document.addEventListener('click', e => {
  const drawer = document.getElementById('navDrawer');
  if (drawer.classList.contains('open') && !drawer.contains(e.target) && !e.target.closest('.nav-ham')) {
    drawer.classList.remove('open');
  }
});
</script>
