<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <link rel="icon" href="/GETXH WEB NEW LOGO.png" type="image/png">
  <title>404 – Page Not Found | GETXH™</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#08101d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <style>
    :root {
      --bg: #070c18;
      --card-bg: rgba(15, 23, 42, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --purple: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    /* Ambient glowing background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 20%, rgba(56, 189, 248, 0.12), transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 80%, rgba(168, 85, 247, 0.1), transparent 70%),
        radial-gradient(circle at 20% 80%, rgba(37, 99, 235, 0.08), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .logo-wrap {
      display: inline-block;
      margin-bottom: 28px;
    }
    .logo-wrap img {
      height: 48px;
      width: auto;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.25));
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 44px 32px 36px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .glitch-code {
      font-size: clamp(80px, 20vw, 120px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      filter: drop-shadow(0 8px 24px var(--primary-glow));
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #f1f5f9;
      letter-spacing: -0.02em;
    }
    .desc {
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }
    @media (min-width: 480px) {
      .actions {
        flex-direction: row;
        justify-content: center;
      }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      box-shadow: 0 10px 28px rgba(2, 132, 199, 0.55);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }
    .quick-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 20px;
    }
    .quick-link {
      color: #64748b;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .quick-link:hover { color: #38bdf8; }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="logo-wrap" title="GETXH Official">
      <img src="/GETXH WEB NEW LOGO.png" alt="GETXH Logo">
    </a>

    <div class="card">
      <div class="glitch-code">404</div>
      <h1 class="title">Lost in Cyberspace?</h1>
      <p class="desc">The page you were looking for doesn't exist, was moved, or the link is broken.</p>

      <div class="actions">
        <a href="/dashboard" class="btn btn-primary">
          <span class="material-symbols-outlined" style="font-size:18px;">dashboard</span>
          Go to Dashboard
        </a>
        <a href="/" class="btn btn-secondary">
          <span class="material-symbols-outlined" style="font-size:18px;">home</span>
          Back to Home
        </a>
      </div>

      <div class="quick-links">
        <a href="/services" class="quick-link">Services</a>
        <span style="color:rgba(255,255,255,0.1)">•</span>
        <a href="/blogs" class="quick-link">Blogs</a>
        <span style="color:rgba(255,255,255,0.1)">•</span>
        <a href="/contact" class="quick-link">Support</a>
      </div>
    </div>

    <p class="footer-note">© 2026 GETXH™. India's #1 Cheapest SMM Panel.</p>
  </div>
</body>
</html>
