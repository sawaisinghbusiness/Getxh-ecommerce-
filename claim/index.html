<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GETXH</title>
<meta name="robots" content="noindex, nofollow"/>
<meta name="referrer" content="no-referrer"/>
<style>html,body{margin:0;background:#0b1220;min-height:100vh}</style>
<script>
// Free-views link. Nothing is shown here: the token (in the #fragment, so it never reaches any
// server with the page request) is kept for this browser and the visitor goes straight on.
// The dashboard claims it in the background after login and shows a card when the views are added.
(function () {
  var m = /(?:^|[#&])t=([A-Za-z0-9_-]{20,100})/.exec(location.hash);
  try {
    if (m) {
      sessionStorage.setItem('gx_claim_token', m[1]);
      localStorage.setItem('gx_claim_token', JSON.stringify({ t: m[1], at: Date.now() }));
    }
    if (location.hash) history.replaceState(null, '', location.pathname);
  } catch (_) {}
  var loggedIn = false;
  try { loggedIn = localStorage.getItem('getxh_user_logged_in') === 'yes'; } catch (_) {}
  location.replace(loggedIn ? '/dashboard' : '/register/');
})();
</script>
</head>
<body></body>
</html>
