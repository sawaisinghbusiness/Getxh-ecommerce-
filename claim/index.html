<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Free Offer — GETXH</title>
<meta name="robots" content="noindex, nofollow"/>
<meta name="referrer" content="no-referrer"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020617;--surface:#0f172a;--surface2:#1e293b;
  --border:rgba(255,255,255,0.1);
  --text:#f1f5f9;--muted:#94a3b8;
  --purple:#8b5cf6;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;
  --grad:linear-gradient(135deg,#8b5cf6,#3b82f6);
}
html,body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body{display:flex;align-items:center;justify-content:center;padding:20px;}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:36px 30px;width:100%;max-width:440px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.brand{font-size:1.1rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:22px;}
.icon{width:56px;height:56px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--surface2);}
.icon.ok{background:rgba(34,197,94,.15)}
.icon.bad{background:rgba(239,68,68,.15)}
h1{font-size:1.25rem;font-weight:800;margin-bottom:10px;line-height:1.3;word-break:break-word;}
p{font-size:.92rem;color:var(--muted);line-height:1.6;margin-bottom:22px;white-space:pre-wrap;word-break:break-word;}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);margin-bottom:10px;word-break:break-word;}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:11px;background:var(--grad);color:#fff;font:700 .95rem 'Inter',sans-serif;cursor:pointer;text-decoration:none;transition:opacity .2s,transform .2s;}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.link{display:inline-block;margin-top:14px;font-size:.85rem;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--purple);border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.hidden{display:none!important}
input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;font:inherit;font-size:1rem;outline:none;margin-bottom:10px;text-align:center}
input:focus{border-color:var(--purple)}
.note{min-height:1.2em;font-size:.82rem;color:#fca5a5;margin-bottom:12px}
a.btn{margin-top:0}
a.link{display:inline-block;margin-top:14px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main class="card" id="card" aria-live="polite">
  <div class="brand">GETXH</div>
  <div id="view"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const API = "https://backend-for-api-connect-g8ta.onrender.com";
const KEY = "gx_claim_token";
const NOT_VALID = "This link is not valid.";

const app  = initializeApp({
  apiKey: "AIzaSyClO8clBVgSHKx8jarNwC38oMtWRK0W8KE",
  authDomain: "getxh-42588.firebaseapp.com",
  projectId: "getxh-42588",
  storageBucket: "getxh-42588.firebasestorage.app",
  messagingSenderId: "170770122888",
  appId: "1:170770122888:web:7adcf91077d5695b06b73d"
});
const auth = getAuth(app);

// The token travels in the #fragment, so it is never sent to any server by the page request
// (and not in a Referer header). Move it into this tab's memory and wipe it from the address bar.
function readToken() {
  try {
    const m = /(?:^|[#&])t=([A-Za-z0-9_-]{20,100})/.exec(location.hash);
    if (m) sessionStorage.setItem(KEY, m[1]);
    if (location.hash) history.replaceState(null, "", location.pathname);
    return sessionStorage.getItem(KEY) || "";
  } catch (_) { return ""; }
}
const dropToken = () => { try { sessionStorage.removeItem(KEY); } catch (_) {} };

const view = document.getElementById("view");
function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "onclick") node.onclick = v;
    else node.setAttribute(k, v);
  }
  for (const kid of kids) node.append(kid);   // strings become text nodes: never parsed as HTML
  return node;
}
function show(...nodes) { view.replaceChildren(...nodes); }
const icon = (cls, glyph) => el("div", { class: "icon " + cls }, glyph);
const toDashboard = () => { dropToken(); location.replace("/dashboard"); };
const num = (n) => Number(n).toLocaleString("en-IN");

function showLoading(text) { show(el("div", { class: "spin" }), el("p", {}, text)); }
function showMessage(kind, glyph, title, text) {
  show(icon(kind, glyph), el("h1", {}, title), el("p", {}, text), el("button", { class: "btn", onclick: toDashboard }, "Go to my account"));
}
const showInvalid = () => { dropToken(); showMessage("bad", "✕", NOT_VALID, "Please check that you opened the full link you were given."); };

function showSuccess(views) {
  // Straight to the dashboard, where the free service is already selected.
  try { sessionStorage.setItem("gx_free_welcome", String(views)); } catch (_) {}
  dropToken();
  show(icon("ok", "🎁"), el("h1", {}, num(views) + " free views added!"),
       el("p", {}, "Your free service is ready. Taking you to your account…"));
  setTimeout(() => location.replace("/dashboard"), 900);
}

function askMobile(user, token, note) {
  const input = el("input", { type: "tel", inputmode: "numeric", autocomplete: "tel", maxlength: "16", placeholder: "10-digit mobile number", id: "mobile" });
  const msg = el("p", { class: "note" }, note || "");
  const go = el("button", { class: "btn", onclick: () => {
    const v = input.value.trim();
    if (!/^[+0-9\s-]{10,16}$/.test(v)) { msg.textContent = "Enter a valid 10-digit mobile number."; return; }
    go.disabled = true; claim(user, token, v);
  } }, "Get my free views");
  show(icon("", "📱"), el("h1", {}, "One last step"),
       el("p", {}, "Enter your mobile number. Each mobile number can receive this offer only once."),
       input, msg, go, el("button", { class: "link", onclick: toDashboard }, "Not now"));
  input.focus();
}

async function claim(user, token, mobile) {
  showLoading("Getting your free views… this can take a few seconds.");
  let res, data = {};
  try {
    const idToken = await user.getIdToken();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 70000);   // the server can be asleep on the free plan
    res = await fetch(API + "/secret-links/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + idToken },
      body: JSON.stringify(mobile ? { token, mobile } : { token }),
      cache: "no-store", referrerPolicy: "no-referrer", credentials: "omit", signal: ctrl.signal
    });
    clearTimeout(timer);
    data = await res.json().catch(() => ({}));
  } catch (_) {
    // Network problem: nothing was claimed, so keep the token and let the user try again.
    show(icon("bad", "!"), el("h1", {}, "Could not connect"), el("p", {}, "Please check your internet and try again."),
         el("button", { class: "btn", onclick: () => claim(user, token, mobile) }, "Try again"));
    return;
  }
  if (res.status === 200 && data.status === "success") return showSuccess(data.views);
  if (res.status === 422) return askMobile(user, token, "");
  if (res.status === 400 && data.status === "bad_mobile") return askMobile(user, token, data.message);
  if (res.status === 409 && data.status === "mobile_used") { dropToken(); return showMessage("bad", "✕", "Offer already used", data.message); }
  if (res.status === 409) {
    dropToken();
    const left = Number(data.remaining) || 0;
    return showMessage("ok", "✓", "You already have this offer",
      left >= 100 ? "You still have " + num(left) + " free views. Open your account to use them." : "You have already used this offer.");
  }
  if (res.status === 429) {
    return show(icon("bad", "!"), el("h1", {}, "Too many attempts"), el("p", {}, "Please wait a few minutes and try again."),
                el("button", { class: "link", onclick: toDashboard }, "Go to my account"));
  }
  if (res.status === 401) {
    return show(icon("bad", "!"), el("h1", {}, "Please log in again"), el("p", {}, "Your session expired."),
                el("button", { class: "btn", onclick: () => location.replace("/") }, "Log in"));
  }
  if (res.status === 403) { dropToken(); return showMessage("bad", "✕", "Not available", data.message || "This account cannot use this link."); }
  showInvalid();
}

function needLogin() {
  show(
    icon("", "🎁"),
    el("h1", {}, "You have a free offer"),
    el("p", {}, "Create your account (or log in) and your free views are added automatically."),
    el("a", { class: "btn", href: "/register/" }, "Create account"),
    el("a", { class: "link", href: "/" }, "I already have an account — log in")
  );
}

const token = readToken();
if (!token) {
  showInvalid();
} else {
  showLoading("Checking your login…");
  let handled = false;
  onAuthStateChanged(auth, (user) => {
    if (handled) return;
    handled = true;
    // Not logged in: the token stays in this tab, and after logging in or registering the
    // dashboard sends the user straight back here.
    if (!user) return needLogin();
    claim(user, token);
  });
}
</script>
</body>
</html>
