<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password | GETXH – SMM Panel India</title>
<meta name="description" content="Reset your GETXH account password securely."/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/GETXH WEB NEW LOGO.png" type="image/png"/>

<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#020617;--bg2:#0f172a;--purple:#8b5cf6;--blue:#3b82f6;
  --text:#f1f5f9;--muted:#94a3b8;
}

html,body{
  min-height:100%;font-family:'Inter',sans-serif;
  background:#090a0f;color:var(--text);overflow-x:hidden;
}
a,button,input,.card{transition:all 0.3s ease;}

/* Background */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background: url('/new%20background%20image.png') center center / cover no-repeat;
}
body::after{
  display:none;
}

/* Plexus / constellation full page fixed background removed */
.plexus-bg{
  display:none !important;
}

.page{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px 20px;position:relative;z-index:2;
}

.orb{display:none;}

.wrap{width:100%;max-width:440px;position:relative;z-index:2;}

/* Logo */
.brand{display:flex;justify-content:center;align-items:center;margin-bottom:24px;}
.brand-logo-wrap{display:inline-flex;}
.brand-logo-wrap img{height:90px;width:auto;display:block;}

/* Card */
.card-shine-wrap{position:relative;width:100%;border-radius:20px;}
.card-shine-wrap::before, .card-shine-wrap::after{display:none;}

.card{position:relative;z-index:2;width:100%;background:#0f172a;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.45);}

.card-head{text-align:left;margin-bottom:22px;}
.card-title{font-size:19px;font-weight:600;letter-spacing:-0.01em;color:#ffffff;}
.card-sub{font-size:13.5px;color:#94a3b8;margin-top:6px;line-height:1.55;}

/* Boxes */
#errorBox{display:none;align-items:center;gap:6px;padding:10px 12px;border-radius:10px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:#fca5a5;font-size:13px;font-weight:400;margin-bottom:14px;}
#infoBox{display:none;align-items:center;gap:6px;padding:0;background:none;border:none;color:#94a3b8;font-size:13px;font-weight:400;margin-bottom:14px;}

/* Form */
.fgroup{margin-bottom:16px;}
.flabel{display:block;font-size:13px;font-weight:500;color:#cbd5e1;margin-bottom:6px;}
.iwrap{position:relative;}
.iicon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#64748b;pointer-events:none;display:flex;transition:color 0.25s;}
.iwrap:focus-within .iicon{color:#60a5fa;}
.finput{width:100%;height:44px;background:#0b1220;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:0 14px 0 40px;color:#f1f5f9;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:all 0.28s ease;}
.finput::placeholder{color:#475569;}
.finput:hover{border-color:rgba(255,255,255,0.18);}
.finput:focus{border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.2);}

/* Validation */
.field-err{font-size:11.5px;font-weight:500;color:#f87171;margin-top:5px;padding-left:3px;min-height:15px;display:flex;align-items:center;gap:5px;opacity:0;transform:translateY(-5px);transition:opacity 0.22s ease,transform 0.22s ease;pointer-events:none;}
.field-err.show{opacity:1;transform:translateY(0);}
.finput.input-error{border-color:rgba(239,68,68,0.65)!important;box-shadow:0 0 0 3px rgba(239,68,68,0.13),0 0 18px rgba(239,68,68,0.09)!important;}

@keyframes shake{0%,100%{transform:translateX(0);}15%{transform:translateX(-3.5px);}30%{transform:translateX(3.5px);}48%{transform:translateX(-2.5px);}64%{transform:translateX(2.5px);}80%{transform:translateX(-1px);}92%{transform:translateX(1px);}}
.shake{animation:shake 0.36s cubic-bezier(0.36,0.07,0.19,0.97) both;}

.btn{width:100%;height:44px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;position:relative;overflow:hidden;transition:background 0.15s ease;box-shadow:none;margin-top:4px;}
.btn:hover:not(:disabled){background:#1D4ED8;}
.btn:disabled{opacity:0.65;cursor:not-allowed;}

.cfoot{display:flex;align-items:center;justify-content:center;margin-top:18px;gap:6px;font-size:13px;color:#475569;}
.link-back{font-size:13px;font-weight:500;color:#94a3b8;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:color 0.2s;}
.link-back:hover{color:#ffffff;}
</style>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>{r.forEach(reg=>reg.unregister())})}</script>
</head>

<body>

<div class="page">
  <div class="wrap">

    <div class="brand">
      <div class="brand-logo-wrap">
        <img src="/GETXH WEB NEW LOGO.png" alt="GETXH"/>
      </div>
    </div>

    <div class="card-shine-wrap">
      <div class="card">

        <div class="card-head">
          <h1 class="card-title">Reset your password</h1>
          <p class="card-sub">Enter the email you signed up with. We'll send you a code.</p>
        </div>

        <div id="errorBox"></div>
        <div id="infoBox"></div>

        <div class="fgroup">
          <label class="flabel" for="email">Email</label>
          <div class="iwrap">
            <span class="iicon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input id="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false"
              class="finput" placeholder="you@example.com"
              oninput="clearErr('email','err-email')"
              onkeydown="if(event.key==='Enter')sendOTP()"/>
          </div>
          <div class="field-err" id="err-email"></div>
        </div>

        <button id="sendBtn" class="btn" onclick="sendOTP()">Send OTP</button>

        <div class="cfoot">
          <a class="link-back" href="/">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
            </svg>
            Back to Sign In
          </a>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
function setErr(inputId, errId, msg) {
  const inp = document.getElementById(inputId);
  const err = document.getElementById(errId);
  if (inp) inp.classList.add("input-error");
  if (err) { err.textContent = msg; err.classList.add("show"); }
}

function clearErr(inputId, errId) {
  const inp = document.getElementById(inputId);
  const err = document.getElementById(errId);
  if (inp) inp.classList.remove("input-error");
  if (err) { err.textContent = ""; err.classList.remove("show"); }
  const eb = document.getElementById("errorBox");
  if (eb) eb.style.display = "none";
}

function shake(inputId) {
  const el = document.getElementById(inputId);
  if (!el) return;
  const wrap = el.closest(".iwrap") || el;
  wrap.classList.remove("shake");
  void wrap.offsetWidth;
  wrap.classList.add("shake");
  if (navigator.vibrate) { try { navigator.vibrate(30); } catch(e){} }
  wrap.addEventListener("animationend", () => wrap.classList.remove("shake"), { once: true });
}

function showError(msg) {
  const eb = document.getElementById("errorBox");
  eb.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> ' + msg;
  eb.style.display = "flex";
}

function showInfo(msg) {
  const ib = document.getElementById("infoBox");
  ib.textContent = msg;
  ib.style.display = "flex";
}

async function sendOTP() {
  const emailInp = document.getElementById("email");
  const email = String(emailInp.value || "").trim().toLowerCase();
  const btn = document.getElementById("sendBtn");

  clearErr("email", "err-email");

  if (!email) {
    setErr("email", "err-email", "Enter email to continue");
    shake("email");
    emailInp.focus();
    return;
  }

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    setErr("email", "err-email", "Enter a valid email address");
    shake("email");
    emailInp.focus();
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;animation:spin 0.7s linear infinite;display:inline-block"></span>Sending code…</span>';

  try {
    const res = await fetch("https://backend-for-email-verification-code-vwip.onrender.com/send-otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, type: "reset" })
    });

    const data = await res.json().catch(() => ({}));

    if (res.ok && (data.success || data.status === "success" || data.message === "OTP sent")) {
      try { sessionStorage.setItem("gx_reset_email", email); } catch(e){}
      showInfo("Code sent. Taking you to verification…");
      setTimeout(() => {
        window.location.href = `/verify-otp?email=${encodeURIComponent(email)}&type=reset`;
      }, 800);
    } else {
      const msg = data.message || data.error || "Unable to send OTP. Please check email and try again.";
      showError(msg);
      shake("email");
      btn.disabled = false;
      btn.textContent = "Send OTP";
    }
  } catch (err) {
    showError("Cannot reach server. Please check your internet connection.");
    shake("email");
    btn.disabled = false;
    btn.textContent = "Send OTP";
  }
}
</script>
<style>@keyframes spin{to{transform:rotate(360deg);}}</style>
</body>
</html>
